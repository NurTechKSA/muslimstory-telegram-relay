name = "telegram-relay"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Секретов здесь нет и быть не должно.
# BOT_TOKEN / RELAY_SECRET / WEBHOOK_SECRET / ORIGIN_URL кладутся через
#   wrangler secret put <NAME>
# см. README.md

[observability]
enabled = true

# Тюнинг ретраев в outbound (не секреты).
#
# Вызывающий бэкенд (muslim-story) сам ретраит с таймаутом 2.5 с на попытку, и
# оба уровня должны быть вложены, а не идти вперехлёст: иначе бэкенд обрывает
# запрос, который релей ещё держит, шлёт свой повтор — и sendMessage уходит
# дважды. Поэтому здесь бюджет заметно меньше 2.5 с.
#
# Бюджет гейтит паузу перед следующей попыткой, а не запрос в полёте: если сам
# Telegram отвечает дольше, релей всё равно дождётся ответа. Полной гарантии
# «уложимся в 2.5 с» тут нет, есть разведение типичного случая.
[vars]
RETRY_MAX_ATTEMPTS = "2"
RETRY_BUDGET_MS = "1800"
RETRY_BASE_DELAY_MS = "200"
